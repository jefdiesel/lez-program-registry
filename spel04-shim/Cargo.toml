[package]
name = "spel04-shim"
description = "SPEL attribute syntax (`#[lez_program]`, `#[instruction]`, `#[account]`, `#[account_type]`) compiled for LEZ v0.4 actors."
# Not the workspace version: a crate's version feeds rustc (-C metadata), so a release bump
# could move the guest's image id, the registry's identity. Change only with a new program build.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
spel04-shim-macros = { path = "macros" }
lee_core.workspace = true
risc0-zkvm.workspace = true
borsh.workspace = true
