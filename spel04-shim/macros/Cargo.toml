[package]
name = "spel04-shim-macros"
description = "Proc macros for spel04-shim: SPEL attribute syntax compiled for LEZ 0.4 actors."
# Not the workspace version: a crate's version feeds rustc (-C metadata), so a release bump
# could move the guest's image id, the registry's identity. Change only with a new program build.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
