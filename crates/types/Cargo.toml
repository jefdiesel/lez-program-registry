[package]
name = "lezreg-types"
description = "LEZ Program Registry: records, limits, SPEL-rule PDA derivation and list walkers. No LEZ dependencies."
# Not the workspace version: a crate's version feeds rustc (-C metadata), so a release bump
# could move the guest's image id, the registry's identity. Change only with a new program build.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "lezreg_types"

[dependencies]
# Only for `#[account_type]` (adds the borsh derives); a proc-macro crate with no LEZ dependency.
spel04-shim-macros = { path = "../../spel04-shim/macros" }
borsh.workspace = true
sha2.workspace = true
bs58.workspace = true
