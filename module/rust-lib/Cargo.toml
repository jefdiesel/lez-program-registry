[package]
name = "program_registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LEZ Program Registry as a Logos core module: program labels, entries, IDLs and verification status for any Basecamp app"

# Standalone crate: the module builder copies only this directory, so the registry's read SDK
# comes from the public repository at a pinned revision instead of a path.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
lezreg-sdk = { git = "https://github.com/jefdiesel/lez-program-registry", rev = "d7c4688517058c2ab29b667abe792bb6e086eec0", default-features = false }
serde_json = "1"
hex = "0.4"
# Staged by the builder from the logos-rust-sdk revision its code generator comes from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
