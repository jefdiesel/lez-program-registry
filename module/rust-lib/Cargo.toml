[package]
name = "program_registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LEZ Program Registry as a Logos core module: program labels, entries, IDLs and verification status for any Basecamp app"

# Standalone crate: the module builder copies only this directory, so the registry's read SDK
# comes from the public repository at a pinned revision instead of a path.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
lezreg-sdk = { git = "https://github.com/jefdiesel/lez-program-registry", rev = "f290894f12640cafbecbbe5a57b17608bd67f92f", default-features = false }
serde_json = "1"
# The module's own paced, cached sequencer client (src/net.rs); the SDK already brings ureq 3.
ureq = "3.4.2"
hex = "0.4"
# Opening an LNS profile for its public account (src/labels.rs: author_label_proven), the cipher
# lezreg-sdk already uses; goes once the SDK pin carries apps::AuthorLabels.
aes-gcm = "0.10"
# The module builds registry instructions itself (src/writes.rs), with the borsh lezreg-types uses.
borsh = { version = "1.5.7", features = ["derive"] }
# Staged by the builder from the logos-rust-sdk revision its code generator comes from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
