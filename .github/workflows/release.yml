# Release binaries of the `lezreg` CLI (DESIGN §7.4) and the one-line installer.
#
# On a tag `vX.Y.Z`:
#   1. build `lezreg` in release mode for Linux x86_64 and aarch64 (on Ubuntu 22.04 runners, the
#      oldest that still exist) and macOS arm64, from a clean checkout with no build cache;
#   2. pack each as lezreg-X.Y.Z-<os>-<arch>.tar.gz with the licence files, and attest its
#      build provenance (verify: see the README, "By hand");
#   3. install each Linux build with scripts/install.sh in bare containers (Debian stable,
#      Ubuntu 22.04, Fedora) and run `lezreg --version` and `lezreg doctor`, plus the
#      installer's refusal tests;
#   4. write SHA256SUMS and attach everything, install.sh included, to a DRAFT release for tag
#      vX.Y.Z. Publishing the draft is left to a person. A rerun replaces an earlier draft of
#      the same version; a published release is never touched.
# By hand (Actions → release → Run workflow, version X.Y.Z): a dry build. Steps 1 and 3 run and
# the tarballs are kept as workflow artefacts, but nothing is attested and no release is made:
# release provenance only ever names a tag.
#
# What the build does not need: the RISC Zero toolchain. lezreg builds no guest (the LEZ crates
# embed their programs from LEZ's committed artifacts/), so rzup is not installed here.
# What the binary needs at run time: r0vm 3.0.5 for writes (lee is built without `prove`, so
# simulation runs in r0vm) and a Logos Storage node to upload an IDL. install.sh explains both
# and fetches them on request (--with-r0vm, --with-storage).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a dry build, X.Y.Z without the v (must equal the workspace version in Cargo.toml). Releases come only from tags."
        required: true

permissions:
  contents: read

# One run per version at a time, whether started by a tag (v0.1.0) or by hand (0.1.0).
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # Belt and braces: nothing in lezreg's tree calls risc0_build, but if anything ever did, it
  # must not start a guest build here.
  RISC0_SKIP_BUILD: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version from the tag or the input, checked against Cargo.toml
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$INPUT; fi
          echo "release $v, Cargo.toml $cargo_v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version '$v'"; exit 1; }
          [ "$v" = "$cargo_v" ] || { echo "the release version must equal [workspace.package] version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: shellcheck scripts/install.sh
        run: shellcheck -s sh scripts/install.sh
      - name: install.sh on Alpine (musl) refuses with a clear message
        run: |
          if docker run --rm -v "$PWD/scripts:/s:ro" alpine:3.22 sh /s/install.sh --allow-root --dry-run 2>err; then
            echo "FAILED: accepted on musl"; exit 1
          fi
          cat err; grep -q "need glibc" err

  build:
    needs: version
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # No build cache: a release binary is built from the checkout alone, never from a cache an
    # earlier run (on any branch) wrote. A cold build takes about 10 (Linux) to 15 (macOS) min.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # for the attestation, which runs only on a tag
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-22.04 }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm }
          - { target: macos-arm64, runner: macos-15 }
          # No macOS x86_64: logos-blockchain-circuits (linked through the LEZ crates) publishes
          # no prebuilt library for it, and building those circuits is not cheap.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The LEZ wallet links Keycard support through the `pcsc` crate, i.e. libpcsclite. Linked
      # the usual way the binary would not start without libpcsclite.so.1, which most servers,
      # containers and many desktops lack (and lezreg never uses a card). So link a small static
      # stand-in that dlopens the system library on first use (scripts/release/pcsc-dlopen.c).
      - name: "Linux: PC/SC headers and the static stand-in for libpcsclite"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libpcsclite-dev pkg-config
          d="$RUNNER_TEMP/pcsc" && mkdir -p "$d"
          cc -O2 -fPIC -Wall -Wextra -Werror $(pkg-config --cflags libpcsclite) -c scripts/release/pcsc-dlopen.c -o "$d/pcsc-dlopen.o"
          ar rcs "$d/libpcsclite.a" "$d/pcsc-dlopen.o"
          echo "PCSC_LIB_DIR=$d" >> "$GITHUB_ENV"
          echo "PCSC_LIB_NAME=static=pcsclite" >> "$GITHUB_ENV"

      # The LEZ crates link logos-blockchain-circuits' prebuilt static libraries. Their build
      # script would download them unchecked; fetch the same release asset here, check it
      # against a pinned SHA-256, and point the build at it with LBC_ROOT_DIR.
      - name: logos-blockchain-circuits v0.5.7 (prebuilt release asset, pinned by SHA-256)
        shell: bash
        run: |
          grep -q 'logos-blockchain-circuits.git?tag=v0.5.7#' Cargo.lock ||
            { echo "Cargo.lock no longer pins logos-blockchain-circuits v0.5.7: update the hashes here"; exit 1; }
          case "${{ matrix.target }}" in
            linux-x86_64) a=linux-x86_64; s=92a0c6ad810d486631518b7b9b247a2b66f66af6f8f8ddce381acbbdfedc0f7f ;;
            linux-aarch64) a=linux-aarch64; s=1eaa3e339d85d741dd70314c4ad45b7ee67c2baaf6c55e35170801161c372d7b ;;
            macos-arm64) a=macos-aarch64; s=75a52885bf3b3aad513457f929fe4842cd51b3c46226e145f21a0858bb8b4b25 ;;
          esac
          n=logos-blockchain-circuits-v0.5.7-$a
          curl -fsSL -o "$RUNNER_TEMP/$n.tar.gz" "https://github.com/logos-blockchain/logos-blockchain-circuits/releases/download/v0.5.7/$n.tar.gz"
          echo "$s  $RUNNER_TEMP/$n.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$n.tar.gz" -C "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/$n/lib"
          echo "LBC_ROOT_DIR=$RUNNER_TEMP/$n" >> "$GITHUB_ENV"

      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install 2>/dev/null || rustup show
          rustc --version && cargo --version

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Build lezreg (release, offline, locked)
        run: cargo build --release --frozen -p lezreg

      - name: Check the binary (version, dynamic libraries, symbol versions)
        shell: bash
        run: |
          B=target/release/lezreg
          ls -l "$B"
          file "$B"
          "$B" --version
          test "$("$B" --version)" = "lezreg $VERSION"
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$B"
            if ldd "$B" | grep -q pcsclite; then echo "libpcsclite is still linked dynamically"; exit 1; fi
            echo "highest GLIBC symbol:   $(objdump -T "$B" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "highest GLIBCXX symbol: $(objdump -T "$B" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          else
            otool -L "$B"
            otool -l "$B" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | grep -E 'minos|version' | head -2
            codesign -v --verbose=2 "$B"
          fi

      - name: Pack
        shell: bash
        run: |
          n="lezreg-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$n"
          cp target/release/lezreg LICENSE-MIT LICENSE-APACHE "dist/$n/"
          tar -C dist -czf "dist/$n.tar.gz" "$n"
          rm -rf "dist/$n"
          (cd dist && { sha256sum "$n.tar.gz" 2>/dev/null || shasum -a 256 "$n.tar.gz"; })

      - name: Attest build provenance (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/lezreg-*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lezreg-${{ matrix.target }}
          path: dist/lezreg-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Install each Linux build with install.sh in a bare distro container (no libpcsclite, no
  # Rust, nothing of ours) and run it. The tarball is served from a local directory through
  # LEZREG_BASE_URL=file://..., which is the same download-and-verify path the real URL takes.
  test-linux:
    needs: [version, build]
    name: install ${{ matrix.target }} in ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "debian:stable" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:22.04" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "fedora:latest" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "debian:stable" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:22.04" }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Tools a user would have (curl, tar, unzip); no PC/SC, no Rust
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends curl ca-certificates unzip
          else
            dnf install -y -q tar gzip unzip   # curl (curl-minimal) is in the image
          fi
          if ls /usr/lib*/libpcsclite.so.1 /usr/lib/*/libpcsclite.so.1 2>/dev/null; then echo "libpcsclite is present: the test would prove nothing"; exit 1; fi
          echo "no libpcsclite on this image (as intended)"
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lezreg-${{ matrix.target }}
          path: rel
      - name: SHA256SUMS for the local release directory
        run: cd rel && sha256sum lezreg-*.tar.gz | tee SHA256SUMS
      # These containers run as root, so every install below passes --allow-root; this step
      # checks the refusals first.
      - name: Installer refusals (root, hostile versions, crafted SHA256SUMS, non-https URL, bad checksum)
        run: |
          fail() { echo "FAILED: $*"; exit 1; }
          I=scripts/install.sh
          echo "== root without --allow-root"
          if sh $I --dry-run 2>err; then fail "ran as root without --allow-root"; fi
          cat err; grep -q "refusing to run as root" err
          echo "== hostile versions are refused before any download"
          for v in '0.1.0/../../../../evil/x' '1;id' '../x' '0.1.0?x=1' '-x' ' 0.1.0' 'x0.1.0'; do
            if LEZREG_VERSION="$v" sh $I --allow-root 2>err; then fail "version '$v' accepted"; fi
            cat err; grep -q "bad version" err
          done
          echo "== a crafted SHA256SUMS (path in the name, junk after it) matches nothing"
          mkdir craft && cp rel/*.tar.gz craft/
          h=$(cut -d' ' -f1 rel/SHA256SUMS)
          printf '%s  lezreg-x/../../evil-%s.tar.gz\n%s  lezreg-%s-%s.tar.gz?x\n%s  ../lezreg-%s-%s.tar.gz\n' \
            "$h" "$TARGET" "$h" "$VERSION" "$TARGET" "$h" "$VERSION" "$TARGET" > craft/SHA256SUMS
          if LEZREG_HOME="$PWD/h-craft" LEZREG_BASE_URL="file://$PWD/craft" sh $I --allow-root 2>err; then fail "crafted SHA256SUMS accepted"; fi
          cat err; grep -q "lists no lezreg build" err; test ! -e h-craft/bin/lezreg
          echo "== non-https base URLs are refused"
          for u in http://github.com/x ftp://x/y file:relative; do
            if LEZREG_BASE_URL="$u" sh $I --allow-root --dry-run 2>err; then fail "base URL $u accepted"; fi
            cat err; grep -q "must be https" err
          done
          echo "== a tampered SHA256SUMS is refused and installs nothing"
          mkdir bad && cp rel/*.tar.gz bad/
          sed 's/^./0/' rel/SHA256SUMS > bad/SHA256SUMS
          if LEZREG_HOME="$PWD/h-bad" LEZREG_BASE_URL="file://$PWD/bad" sh $I --allow-root 2>err; then fail "bad checksum accepted"; fi
          cat err; grep -q "SHA-256 mismatch" err; test ! -e h-bad/bin/lezreg
          echo "== a relative LEZREG_HOME becomes absolute"
          LEZREG_HOME=h-rel sh $I --allow-root --dry-run | tee out; grep -q "install:   $PWD/h-rel/bin/lezreg" out
      - name: Planted symlinks in bin are replaced, never written through
        run: |
          mkdir -p h-sym/bin h-sym/share/lezreg && echo keep > victim
          for n in lezreg lezreg.new r0vm.new logos-storage.new .lezreg.new; do ln -s "$PWD/victim" "h-sym/bin/$n"; done
          ln -s "$PWD/victim" h-sym/share/lezreg/LICENSE-MIT
          LEZREG_HOME="$PWD/h-sym" LEZREG_BASE_URL="file://$PWD/rel" sh scripts/install.sh --allow-root
          test "$(cat victim)" = keep
          test -f h-sym/bin/lezreg && test ! -L h-sym/bin/lezreg
          test -f h-sym/share/lezreg/LICENSE-MIT && test ! -L h-sym/share/lezreg/LICENSE-MIT
          ls -la h-sym/bin
          h-sym/bin/lezreg --version
          echo "victim untouched: $(cat victim)"
      - name: wget only (no curl on PATH)
        run: |
          fail() { echo "FAILED: $*"; exit 1; }
          if ! command -v apt-get >/dev/null; then echo "(apt images only)"; exit 0; fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends wget
          mkdir wonly
          for t in sh uname id sed grep head cut mktemp tar gzip cp mv chmod mkdir rm sha256sum getconf wget cat; do
            ln -s "$(command -v $t)" "wonly/$t"
          done
          echo "== no curl here"; if PATH="$PWD/wonly" wonly/sh -c 'command -v curl'; then fail "curl is on PATH"; fi
          echo "== a non-https base URL is refused before wget runs"
          if PATH="$PWD/wonly" LEZREG_BASE_URL=http://github.com/x wonly/sh scripts/install.sh --allow-root 2>err; then fail "http accepted"; fi
          cat err; grep -q "must be https" err
          echo "== install with wget: the tarball from file://, r0vm over https (wget --https-only)"
          PATH="$PWD/wonly" LEZREG_HOME="$PWD/h-wget" LEZREG_BASE_URL="file://$PWD/rel" wonly/sh scripts/install.sh --allow-root --with-r0vm
          h-wget/bin/lezreg --version
          if [ "$TARGET" = linux-x86_64 ]; then h-wget/bin/r0vm --version; fi
      - name: Install, piped as `curl ... | sh` would (with r0vm and Storage)
        run: |
          export LEZREG_HOME="$PWD/h" LEZREG_BASE_URL="file://$PWD/rel"
          cat scripts/install.sh | sh -s -- --allow-root --with-r0vm --with-storage
      - name: lezreg --version, doctor, r0vm, logos-storage
        run: |
          export PATH="$PWD/h/bin:$PATH" HOME="$PWD/home" LEE_WALLET_HOME_DIR="$PWD/home/wallet"
          mkdir -p "$HOME"
          ls -l h/bin
          lezreg --version
          test "$(lezreg --version)" = "lezreg $VERSION"
          ldd h/bin/lezreg
          # No sequencer runs here, so doctor reports the sequencer as FAIL and exits non-zero.
          if lezreg doctor; then echo "(doctor passed)"; else echo "(doctor exit $?: expected, no sequencer here)"; fi
          lezreg --help | head -3
          if [ -x h/bin/r0vm ]; then h/bin/r0vm --version; fi
          # The Storage v0.5.3 Linux build needs glibc 2.38: installed and running on newer
          # images, refused by the installer (not installed) on older ones.
          if [ -x h/bin/logos-storage ]; then h/bin/logos-storage --version; else echo "logos-storage not installed ($(getconf GNU_LIBC_VERSION))"; fi

  release:
    needs: [version, build, test-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lezreg-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cp scripts/install.sh dist/
          cd dist && sha256sum lezreg-*.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS && ls -l
      - name: Attest install.sh and SHA256SUMS (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/SHA256SUMS
      - name: Draft release v${{ env.VERSION }} (replacing an earlier draft of this version)
        run: |
          tag="v$VERSION"
          cat > notes.md <<EOF
          Prebuilt \`lezreg\` $VERSION for Linux x86_64 and aarch64 (glibc 2.34 or newer) and macOS arm64 (macOS 12 or newer).

          Install (no sudo; installs to ~/.lezreg/bin):

              curl --proto '=https' --tlsv1.2 -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh

          Writes also need RISC Zero's \`r0vm\` 3.0.5, and IDL upload needs a Logos Storage node: add \`-s -- --with-r0vm --with-storage\` after \`sh\`, or see the README.

          Check a download by hand: \`sha256sum -c SHA256SUMS --ignore-missing\` (catches a damaged download only), and its provenance with
          \`gh attestation verify <file> -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$tag --deny-self-hosted-runners\`.

          Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from commit $GITHUB_SHA.
          EOF
          sed -i 's/^          //' notes.md
          # This version's release notes go first, when the repository has them.
          if [ -f "docs/releases/$tag.md" ]; then
            { cat "docs/releases/$tag.md"; printf '\n---\n\n'; cat notes.md; } > notes.full && mv notes.full notes.md
          else
            echo "::warning::no docs/releases/$tag.md: the draft has only the install text"
          fi
          # A published release for this tag is never touched. Drafts for this version (matched by
          # tag or by title: a draft can lose its tag name) are deleted and made again, so a rerun
          # leaves exactly one draft with this run's files.
          rels=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\" or (.draft and .name == \"lezreg $VERSION\")) | \"\(.id) \(.draft)\"")
          if echo "$rels" | grep -q ' false$'; then echo "release $tag is already published: not touching it"; exit 1; fi
          for id in $(echo "$rels" | cut -d' ' -f1); do
            echo "deleting the earlier draft $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "lezreg $VERSION" --notes-file notes.md dist/*
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | {draft, prerelease, html_url, target_commitish, assets: [.assets[].name]}"
