# End to end against a real LEZ v0.4.0-rc1 standalone sequencer and real Logos Storage v0.5.3
# nodes (DESIGN §8.3, milestone M5). Nothing here needs a secret: the payer is LEZ's own
# published local-test genesis account (lez/testnet_initial_state, funded by networks/local.json
# on a fresh chain), and every binary is built from source or pinned by sha256.
#
# 1. sequencer up (fresh chain); 2. two Storage nodes; 3. chain/deploy.sh deploys the registry
# from the committed reproducible artifact, uploading its IDL (--idl-cid push), and the live
# header must equal artifacts/*.imageid; 4. the IDL is fetched through the second node, pinned
# there, and fetched by a third node after the first one stops; a missing node degrades
# cleanly; 5. `lezreg verify <REG> --mark` rebuilds this commit in Docker (compile offline) and
# must say Match.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LEZ_TAG: v0.4.0-rc1
  LEZ_COMMIT: "1806e873"  # quoted: unquoted YAML reads it as 1806 × 10^873
  STORAGE_ZIP: logos-storage-linux-amd64-v0.5.3.zip
  STORAGE_SHA256: 1086fae4f283cab882f133abe4d5a88cfae8d61edba9f0094c7f75b368ec9d56
  RPC: http://127.0.0.1:3062

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (PC/SC for the wallet's Keycard support)
        run: sudo apt-get update -q && sudo apt-get install -y -q libpcsclite-dev pkg-config
      - name: Install rzup (risc0 toolchain)
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 3.0.5
          rzup install rust

      - name: Restore the standalone sequencer (per LEZ commit)
        id: seqcache
        uses: actions/cache/restore@v4
        with:
          path: ~/lez-seq
          key: lez-seq-standalone-${{ env.LEZ_COMMIT }}
      - name: Build sequencer_service --features standalone at ${{ env.LEZ_TAG }}
        if: steps.seqcache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$LEZ_TAG" https://github.com/logos-blockchain/logos-execution-zone.git "$RUNNER_TEMP/lez"
          test "$(git -C "$RUNNER_TEMP/lez" rev-parse --short=8 HEAD)" = "$LEZ_COMMIT"
          (cd "$RUNNER_TEMP/lez" && cargo build --release --features standalone -p sequencer_service)
          mkdir -p ~/lez-seq
          cp "$RUNNER_TEMP/lez/target/release/sequencer_service" ~/lez-seq/
          cp "$RUNNER_TEMP/lez/lez/sequencer/service/networks/local.json" ~/lez-seq/
          rm -rf "$RUNNER_TEMP/lez"
      # Saved right away, not at the end of the job: a later failing step must not throw away
      # a 40-minute build.
      - name: Save the standalone sequencer
        if: steps.seqcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/lez-seq
          key: lez-seq-standalone-${{ env.LEZ_COMMIT }}
      - name: Start the sequencer (fresh chain)
        run: |
          S=~/lez-seq/sequencer_service
          "$S" setup "$RUNNER_TEMP/seq" --config ~/lez-seq/local.json \
            --funding-public-key 0101010101010101010101010101010101010101010101010101010101010100 --create-channel
          RUST_LOG=warn nohup "$S" start "$RUNNER_TEMP/seq" --rpc-listen-address 127.0.0.1:3062 \
            --metrics-listen-address 127.0.0.1:9162 > "$RUNNER_TEMP/seq.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -X POST "$RPC" -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getLastBlockId","params":[]}' && break
            sleep 2
          done
          echo

      - name: Two Storage nodes (Logos Storage v0.5.3 release, pinned by sha256)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$STORAGE_ZIP" "https://github.com/logos-storage/logos-storage-nim/releases/download/v0.5.3/$STORAGE_ZIP"
          echo "$STORAGE_SHA256  $STORAGE_ZIP" | sha256sum -c -
          unzip -q "$STORAGE_ZIP" && mv logos-storage-linux-amd64-v0.5.3 storage && chmod +x storage
          start() { # name api p2p [bootstrap spr]
            mkdir -p "st-$1" && chmod 700 "st-$1"
            args=(--data-dir="st-$1" --api-port="$2" --listen-port="$3" --nat=extip:127.0.0.1 --block-ttl=86400)
            if [ -n "${4:-}" ]; then args+=(--bootstrap-node="$4"); else args+=(--no-bootstrap-node); fi
            nohup ./storage "${args[@]}" > "st-$1.log" 2>&1 & echo $! > "st-$1.pid"
            for i in $(seq 1 60); do curl -sf "127.0.0.1:$2/api/storage/v1/debug/info" >/dev/null && return; sleep 1; done
            echo "node $1 did not start"; cat "st-$1.log"; exit 1
          }
          start a 8090 8070
          SPR=$(curl -s 127.0.0.1:8090/api/storage/v1/spr | python3 -c 'import sys,json;print(json.load(sys.stdin)["spr"])')
          start b 8091 8071 "$SPR"
          echo "SPR_B=$(curl -s 127.0.0.1:8091/api/storage/v1/spr | python3 -c 'import sys,json;print(json.load(sys.stdin)["spr"])')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
      - name: Build lezreg
        run: |
          cargo build --release -p lezreg
          cp target/release/lezreg "$RUNNER_TEMP/lezreg"

      - name: Wallet with LEZ's published local-test genesis account
        run: |
          echo "LEE_WALLET_HOME_DIR=$RUNNER_TEMP/wallet" >> "$GITHUB_ENV"
          echo "LEE_WALLET_PASSWORD=" >> "$GITHUB_ENV"
          echo "LEZREG_CONFIG_DIR=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          export LEE_WALLET_HOME_DIR="$RUNNER_TEMP/wallet" LEE_WALLET_PASSWORD= LEZREG_CONFIG_DIR="$RUNNER_TEMP/config"
          mkdir -p "$LEE_WALLET_HOME_DIR"
          L="$RUNNER_TEMP/lezreg"
          "$L" wallet config set sequencer_addr "$RPC" || true
          "$L" wallet account list >/dev/null
          # PRIVATE_KEY_PUB_ACC_A in lez/testnet_initial_state/src/lib.rs (public test key; local chains only).
          out=$("$L" wallet account import public --private-key 10a26a9aec7d34b82364eeae45c5294dbb0a764b000b94eeb9b58511dc487c4d)
          echo "$out"
          payer=$(echo "$out" | sed -n 's|.*Public/\([1-9A-HJ-NP-Za-km-z]*\).*|\1|p' | head -1)
          test -n "$payer"
          echo "PAYER=$payer" >> "$GITHUB_ENV"
          "$L" network set e2e --rpc "$RPC"

      - name: Deploy the registry from artifacts/ (IDL uploaded to Storage) and check the live image
        env:
          LEZREG_NETWORK: e2e
          LEZREG_STORAGE_API: http://127.0.0.1:8090/api/storage/v1
        run: |
          export LEZREG="$RUNNER_TEMP/lezreg"
          chain/deploy.sh --elf artifacts/lez_program_registry.bin --payer "$PAYER" --rpc "$RPC" \
            --network e2e --commit "$GITHUB_SHA" --idl-cid push | tee deploy.log
          REG=$(sed -n 's/^REG=//p' deploy.log | tail -1)
          test -n "$REG"
          echo "REG=$REG" >> "$GITHUB_ENV"
          "$LEZREG" --json show "$REG" > show.json
          python3 - "$(cat artifacts/lez_program_registry.imageid)" <<'EOF'
          import json, sys
          s = json.load(open("show.json"))
          print(json.dumps(s, indent=1)[:1500])
          text = json.dumps(s)
          assert sys.argv[1] in text, "the live header's image id is not artifacts/"
          EOF

      # docs/sdk.md's worked example, run as written against the registry's own entry.
      - name: SDK worked example (resolve a program id to metadata and IDL)
        run: |
          cargo run --release -p lezreg-sdk --no-default-features --example resolve_program -- \
            "$RPC" "$REG" "$REG" http://127.0.0.1:8090/api/storage/v1 | tee example.out
          grep -q "^lez_program_registry " example.out
          grep -q "fresh: the program runs the image the entry claims" example.out
          grep -qE "IDL: [0-9]+ instructions" example.out

      - name: IDL across nodes, pinning, degradation
        env:
          LEZREG_NETWORK: e2e
        run: |
          L="$RUNNER_TEMP/lezreg"
          A=http://127.0.0.1:8090/api/storage/v1; B=http://127.0.0.1:8091/api/storage/v1; C=http://127.0.0.1:8092/api/storage/v1
          echo "== fetch through node B (network)"
          XDG_CACHE_HOME="$RUNNER_TEMP/c1" "$L" --json idl get "$REG" --storage-api "$B" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["idl"]["name"]=="lez_program_registry";print("ok", d["cid"])'
          echo "== no Storage node: refused cleanly"
          if XDG_CACHE_HOME="$RUNNER_TEMP/c2" "$L" idl get "$REG" --storage-api http://127.0.0.1:8099/api/storage/v1 --tries 1; then echo "expected a failure"; exit 1; fi
          echo "== pin on B, stop A, fetch through a fresh node C"
          "$L" pin "$REG" --storage-api "$B"
          kill "$(cat "$RUNNER_TEMP/st-a.pid")"
          cd "$RUNNER_TEMP" && mkdir -p st-c && chmod 700 st-c
          nohup ./storage --data-dir=st-c --api-port=8092 --listen-port=8072 --nat=extip:127.0.0.1 --block-ttl=86400 --bootstrap-node="$SPR_B" > st-c.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "127.0.0.1:8092/api/storage/v1/debug/info" >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          XDG_CACHE_HOME="$RUNNER_TEMP/c3" "$L" --json idl get "$REG" --storage-api "$C" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["idl"]["name"]=="lez_program_registry";print("ok via C")'
          echo "== pin-all"
          "$L" pin-all --storage-api "$B"

      # M8: the author flow on a sample project. The sample is this checkout under another name:
      # lezreg.toml describes the registry guest, and the program deployed is
      # artifacts/lez_program_registry.bin at a new header account, so the Action step below can
      # rebuild it and match the live program.
      - name: Adoption tools (init, publish, rerun, version bump, release payload, adopt, stats, doctor)
        env:
          LEZREG_NETWORK: e2e
          LEZREG_STORAGE_API: http://127.0.0.1:8091/api/storage/v1
        run: |
          L="$RUNNER_TEMP/lezreg"
          j() { python3 -c "import sys,json;d=json.load(sys.stdin);print($1)"; }
          echo "== init --detect"
          "$L" init --detect --name e2e-sample --label "e2e" --tag sample --author "$PAYER"
          cat lezreg.toml
          grep -q 'binary = "lez_program_registry"' lezreg.toml
          grep -q 'manifest_path = "methods/guest/Cargo.toml"' lezreg.toml
          echo "== doctor"
          "$L" doctor
          echo "== publish: deploy + register in one DeployAndRegister"
          "$L" --json publish --elf artifacts/lez_program_registry.bin > pub1.json
          test "$(j 'd["action"]' < pub1.json)" = "deployed and registered"
          SAMPLE=$(j 'd["program"]' < pub1.json)
          grep -q "program = \"$SAMPLE\"" lezreg.toml
          echo "SAMPLE=$SAMPLE" >> "$GITHUB_ENV"
          echo "== publish again: nothing to send"
          test "$("$L" --json publish --elf artifacts/lez_program_registry.bin | j 'd["action"]')" = "unchanged"
          echo "== version bump: an Update"
          sed -i 's/^version = "\(.*\)"/version = "9.9.1"/' lezreg.toml
          test "$("$L" --json publish | j 'd["action"]')" = "updated"
          test "$("$L" --json show "$SAMPLE" | j 'd["deployer_entry"]["version"]')" = "9.9.1"
          echo "== release payload (live image must match), then publish --from-release (hashes re-checked)"
          sed -i 's/^version = "\(.*\)"/version = "9.9.2"/' lezreg.toml
          "$L" release prepare --elf artifacts/lez_program_registry.bin --out "$RUNNER_TEMP/rel" --live
          cp -r "$RUNNER_TEMP/rel" "$RUNNER_TEMP/rel-bad" && printf 'x' >> "$RUNNER_TEMP/rel-bad/program.bin"
          if "$L" publish --from-release "$RUNNER_TEMP/rel-bad"; then echo "a tampered payload was accepted"; exit 1; fi
          "$L" publish --from-release "$RUNNER_TEMP/rel"
          test "$("$L" --json show "$SAMPLE" | j 'd["deployer_entry"]["version"]')" = "9.9.2"
          echo "== adopt a program deployed without registering"
          X=$("$L" --json deploy artifacts/lez_program_registry.bin --no-register --payer "$PAYER" | j 'd["program"]')
          test "$("$L" --json adopt "$X" --name e2e-adopted | j 'd["action"]')" = "registered"
          echo "== stats"
          "$L" stats --by-month --by-author
          "$L" --json stats --by-month > stats.json
          echo "$PAYER" > team.txt
          "$L" --json stats --exclude-keys team.txt > stats-ex.json
          python3 - <<'EOF'
          import json
          s = json.load(open("stats.json")); x = json.load(open("stats-ex.json"))
          print(s, x, sep="\n")
          assert s["counted"] == 3 and s["programs"] == 3, s      # the registry, the sample, the adopted
          assert s["authors"] == 2, s                             # REG (its own header key) and PAYER
          assert sum(m["entries"] for m in s["by_month"]) == 3, s
          assert x["counted"] == 1 and x["excluded"] == 2 and x["authors"] == 1, x
          EOF
          rm -f pub1.json stats.json stats-ex.json team.txt

      - name: Free disk for the Docker rebuild
        run: |
          rm -rf target ~/.cargo/registry/cache
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: lezreg verify REG (rebuild this commit in Docker, compile offline) says Match
        env:
          LEZREG_NETWORK: e2e
        run: |
          "$RUNNER_TEMP/lezreg" --json verify "$REG" --mark --work "$RUNNER_TEMP/verify" | tee verify.json
          python3 -c 'import json;d=json.load(open("verify.json"));assert d["verdict"]=="Match", d;print("Match", d["rebuilt"])'
          "$RUNNER_TEMP/lezreg" verified

      - name: Free disk again (the first Docker build's cache) before the Action's build
        run: |
          rm -rf "$RUNNER_TEMP/verify"
          docker system prune -af --volumes >/dev/null
          df -h / | tail -1

      # The M8 exit check: the Action itself (prepare mode, no upload) on the sample project:
      # canonical Docker build from lezreg.toml, live image of the sample program on this chain,
      # payload written. It fails on a mismatch.
      - name: The GitHub Action on the sample project
        id: action
        uses: ./action
        with:
          mode: prepare
          rpc: ${{ env.RPC }}
          program-id: ${{ env.SAMPLE }}
          lezreg-bin: ${{ runner.temp }}/lezreg
          upload: "false"
      - name: The Action matched the live program
        run: |
          echo "image ${{ steps.action.outputs.image-id }} live ${{ steps.action.outputs.live-image-id }} match ${{ steps.action.outputs.match }}"
          test "${{ steps.action.outputs.match }}" = "true"
          test "${{ steps.action.outputs.image-id }}" = "$(cat artifacts/lez_program_registry.imageid)"
          ls -la "${{ steps.action.outputs.release-dir }}"

      - name: Logs
        if: always()
        run: |
          tail -40 "$RUNNER_TEMP/seq.log" || true
          for n in a b c; do echo "== storage $n"; tail -15 "$RUNNER_TEMP/st-$n.log" || true; done
