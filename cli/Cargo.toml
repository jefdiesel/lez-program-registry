[package]
name = "lezreg"
description = "lezreg: the LEZ Program Registry command line. Register, update, transfer, freeze, deploy, show, list and search programs, talking straight to a LEZ sequencer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lezreg"
path = "src/main.rs"

[dependencies]
lezreg-sdk = { path = "../sdk/rust" }
lezreg-types = { path = "../crates/types" }
lee_core.workspace = true
wallet.workspace = true
sequencer_service_rpc.workspace = true
hex.workspace = true
borsh.workspace = true
bs58 = { workspace = true, features = ["std"] }
serde_json.workspace = true
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive", "env"] }
libc = "0.2"
url = "2.5.8"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
