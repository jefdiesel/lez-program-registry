[package]
name = "lezreg-idl"
description = "IDL tools for the registry: `lezreg-idl-extend` (adds x-lez04, fills discriminator/spec/metadata) and the IDL drift tests."
# Not the workspace version: env!("CARGO_PKG_VERSION") here is the `metadata.version` written
# into idl/ (the program's IDL), which follows the program (0.1.0), not the tools' release.
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lezreg-idl-extend"
path = "src/main.rs"

[dependencies]
lezreg-program = { path = "../../program" }
lezreg-types = { path = "../../crates/types" }
lee_core.workspace = true
borsh.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
