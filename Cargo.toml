[workspace]
resolver = "3"
members = [
    "crates/types",
    "spel04-shim",
    "spel04-shim/macros",
    "program",
    "methods",
    "methods/guest",
    "tools/engine-test",
    "tools/engine-test/helper-methods",
    "tools/engine-test/helper-methods/guest",
    "tools/idl-drift",
    "tools/smoke",
]
# idl-check pins SPEL v0.7.0, which pins LEZ 0.2.5: it must never share a lock file with 0.4 crates.
exclude = ["spikes", "tools/idl-check", "_deps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jefdiesel/lez-program-registry"

[workspace.dependencies]
# LEZ v0.4.0-rc1 (1806e873).
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["client"] }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
risc0-binfmt = "3.0.5"
borsh = { version = "1.5.7", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
serde_json = "1"
hex = "0.4.3"

# Same keccak patch LEZ applies, so the guest matches what the zone builds.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
